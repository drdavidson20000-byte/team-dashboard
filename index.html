<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영업기획관리실 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-card">
    <h1>영업기획관리실 대시보드</h1>
    <p class="sub">등록된 계정으로 로그인하세요</p>
    <form id="login-form">
      <label for="login-email">이메일</label>
      <input id="login-email" type="email" autocomplete="username" required>
      <label for="login-password">비밀번호</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
      <div id="login-error"></div>
      <button type="submit" class="btn-primary">로그인</button>
    </form>
    <p class="login-hint">계정이 없다면 README의 안내에 따라 Firebase 콘솔에서 팀 공용 계정을 직접 생성하세요.</p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <header class="topbar">
    <h1>영업기획관리실 대시보드</h1>
    <div class="right">
      <span id="sync-status">실시간 동기화</span>
      <span id="user-email"></span>
      <button id="logout-btn">로그아웃</button>
    </div>
  </header>

  <nav class="main-tabs">
    <div class="main-tab active" data-tab="weekly">주간보고</div>
    <div class="main-tab disabled" title="추후 추가 예정">성과관리</div>
    <div class="main-tab disabled" title="추후 추가 예정">+ 탭 추가 예정</div>
  </nav>

  <div class="content-wrap">
    <div class="team-tabs">
      <div class="team-tab active" data-team="planning">영업기획팀</div>
      <div class="team-tab" data-team="management">영업관리팀</div>
    </div>

    <div class="week-bar">
      <button class="nav-arrow" id="week-prev">‹</button>
      <div>
        <div class="week-label" id="week-label">2026년 38주차</div>
        <div class="week-range" id="week-range">9월 14일 ~ 9월 20일</div>
      </div>
      <button class="nav-arrow" id="week-next">›</button>
      <div class="spacer"></div>
      <button class="today-btn" id="week-today">이번 주로</button>
    </div>

    <div id="status-banner" class="empty-hint" hidden></div>

    <div class="columns-wrap" id="columns-wrap">
      <div class="col col-l1">
        <div class="col-header">
          <span class="col-title">프로젝트</span>
          <button class="col-add-btn" id="add-l1-btn">+ 추가</button>
        </div>
        <div class="col-list" id="l1-list"></div>
      </div>

      <div class="col col-l2">
        <div class="col-header">
          <span class="col-title">카테고리</span>
          <button class="col-add-btn" id="add-l2-btn" disabled>+ 추가</button>
        </div>
        <div class="col-list" id="l2-list"></div>
      </div>

      <div class="col col-l3">
        <div class="col-header">
          <span class="col-title" id="l3-title">상세내용</span>
          <button class="import-btn" id="import-prev-week-btn" hidden>◀ 지난 주 내용 가져오기</button>
        </div>
        <div class="col-list" id="l3-list"></div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
